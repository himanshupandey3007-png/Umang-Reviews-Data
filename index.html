  // Apply theme class BEFORE paint to avoid flash, and BEFORE Tailwind loads
  // so it sees the correct class state from the start.
  try {
    const t = localStorage.getItem('theme') || 'dark';
    if (t === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  } catch (_) {}
</script>

// ============================================================
// CONFIG

const GITHUB_REPO  = 'Umang-Reviews-Data';

  `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${FILE_PATH}?t=${Date.now()}`;

const RAG_COLORS = { GREEN: '#10b981', AMBER: '#f59e0b', RED: '#ef4444' };

// ============================================================
// CHART COMPONENT — uses Chart.js via refs
// ============================================================
function ChartCanvas({ config, deps }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, config);
    return () => { chartRef.current?.destroy(); };
  }, deps);
  return <canvas ref={ref} />;
}

// ============================================================
// DATA HOOK
// ============================================================
function useData() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(dataUrl(), { cache: 'reload' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const sheet = wb.Sheets['All reviews'] || wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      const cleaned = data.map(r => ({
        source: String(r.source || ''),
        username: String(r.username || ''),
        rating: Number(r.rating) || 0,
        date: r.date instanceof Date ? r.date : (r.date ? new Date(r.date) : null),
        review: String(r.review || ''),
        category_tags: String(r.category_tags || ''),
        url: String(r.url || ''),
        sentiment: typeof r.sentiment === 'number' ? r.sentiment : (parseFloat(r.sentiment) || 0),
        themes: String(r.themes || ''),
        rag: String(r.rag || '').toUpperCase(),
        url_link: String(r.url_link || r.url || '')
      }));
      setRows(cleaned);
      setLastUpdated(new Date());
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const t = setInterval(load, 10 * 60 * 1000);
    return () => clearInterval(t);
  }, [load]);

  return { rows, loading, error, lastUpdated, reload: load };
}

// ============================================================
// THEME HOOK
// ============================================================
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('theme') || 'dark'; }
    catch (_) { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.body.classList.toggle('dark-bg', theme === 'dark');
    document.body.classList.toggle('light-bg', theme === 'light');
    document.body.classList.toggle('text-slate-100', theme === 'dark');
    document.body.classList.toggle('text-slate-900', theme === 'light');
    try { localStorage.setItem('theme', theme); } catch (_) {}
  }, [theme]);
  return [theme, () => setTheme(t => t === 'dark' ? 'light' : 'dark')];
}

// ============================================================
// EXPORTS
// ============================================================
function exportCSV(rows) {
  const headers = ['date','source','username','rating','sentiment','rag','themes','review','url_link'];
  const escape = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = [headers.join(',')];
  rows.forEach(r => {
    lines.push(headers.map(h => {
      if (h === 'date') return escape(r.date ? r.date.toISOString().slice(0,10) : '');
      return escape(r[h]);
    }).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  triggerDownload(blob, `umang-reviews-${dateStamp()}.csv`);
}

function exportXLSX(rows) {
  const data = rows.map(r => ({
    date: r.date ? r.date.toISOString().slice(0,10) : '',
    source: r.source,
    username: r.username,
    rating: r.rating,
    sentiment: r.sentiment,
    rag: r.rag,
    themes: r.themes,
    review: r.review,
    url_link: r.url_link,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Reviews');
  XLSX.writeFile(wb, `umang-reviews-${dateStamp()}.xlsx`);
}

function exportPDF(rows) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  doc.setFontSize(16);
  doc.setTextColor(30, 41, 59);
  doc.text('UMANG App — Reviews Export', 40, 40);
  doc.setFontSize(10);
  doc.setTextColor(100, 116, 139);
  doc.text(`Generated ${new Date().toLocaleString()}  •  ${rows.length} review(s)`, 40, 58);

  doc.autoTable({
    startY: 75,
    head: [['Date','Source','User','Rating','Sent.','RAG','Themes','Review']],
    body: rows.map(r => [
      r.date ? r.date.toISOString().slice(0,10) : '',
      r.source,
      r.username,
      r.rating || '',
      typeof r.sentiment === 'number' ? r.sentiment.toFixed(2) : '',
      r.rag,
      r.themes,
      r.review.length > 220 ? r.review.slice(0, 217) + '…' : r.review,
    ]),
    styles: { fontSize: 8, cellPadding: 4, overflow: 'linebreak', valign: 'top' },
    headStyles: { fillColor: [30, 41, 59], textColor: 255, fontSize: 9 },
    columnStyles: {
      0: { cellWidth: 60 }, 1: { cellWidth: 90 }, 2: { cellWidth: 70 },
      3: { cellWidth: 38 }, 4: { cellWidth: 38 }, 5: { cellWidth: 45 },
      6: { cellWidth: 120 }, 7: { cellWidth: 'auto' },
    },
    didParseCell: (data) => {
      if (data.section === 'body' && data.column.index === 5) {
        const v = data.cell.raw;
        if (v === 'GREEN') { data.cell.styles.textColor = [16,185,129]; data.cell.styles.fontStyle = 'bold'; }
        if (v === 'AMBER') { data.cell.styles.textColor = [245,158,11]; data.cell.styles.fontStyle = 'bold'; }
        if (v === 'RED')   { data.cell.styles.textColor = [239,68,68]; data.cell.styles.fontStyle = 'bold'; }
      }
    }
  });
  doc.save(`umang-reviews-${dateStamp()}.pdf`);
}

function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a);
  a.click(); a.remove(); URL.revokeObjectURL(url);
}
function dateStamp() { return new Date().toISOString().slice(0,10); }

// ============================================================
// RAG FILTER CHIPS — global filter
// ============================================================
function RagChips({ rows, value, onChange }) {
  const counts = useMemo(() => {
    const c = { GREEN: 0, AMBER: 0, RED: 0 };
    rows.forEach(r => { if (c[r.rag] !== undefined) c[r.rag]++; });
    return { ...c, total: rows.length };
  }, [rows]);

  const chips = [
    { v: '',      label: 'All',   count: counts.total,
      idle: 'border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300',
      active: 'bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 border-slate-800 dark:border-slate-100',
      dot: 'bg-slate-400' },
    { v: 'GREEN', label: 'Green', count: counts.GREEN,
      idle: 'border-emerald-300 dark:border-emerald-700/60 text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/10',
      active: 'bg-emerald-500 text-white border-emerald-500 shadow-md shadow-emerald-500/30',
      dot: 'bg-emerald-500' },
    { v: 'AMBER', label: 'Amber', count: counts.AMBER,
      idle: 'border-amber-300 dark:border-amber-700/60 text-amber-700 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-500/10',
      active: 'bg-amber-500 text-white border-amber-500 shadow-md shadow-amber-500/30',
      dot: 'bg-amber-500' },
    { v: 'RED',   label: 'Red',   count: counts.RED,
      idle: 'border-rose-300 dark:border-rose-700/60 text-rose-700 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10',
      active: 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/30',
      dot: 'bg-rose-500' },
  ];

  return (
    <div className="flex items-center gap-2 flex-wrap mb-4 animate-slide-up">
      <span className="text-xs uppercase tracking-wider font-semibold text-slate-500 dark:text-slate-400 mr-1">Filter:</span>
      {chips.map(c => {
        const active = value === c.v;
        return (
          <button
            key={c.v || 'all'}
            onClick={() => onChange(c.v)}
            className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-sm font-semibold border transition-all ${active ? c.active : `bg-white dark:bg-slate-900/60 ${c.idle}`}`}
          >
            <span className={`w-2 h-2 rounded-full ${active ? 'bg-white' : c.dot}`}></span>
            <span>{c.label}</span>
            <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-bold ${active ? 'bg-white/25' : 'bg-slate-100 dark:bg-slate-800'}`}>{c.count}</span>
          </button>
        );
      })}
    </div>
  );
}

// ============================================================
// KPI GRID
// ============================================================
function KpiGrid({ rows }) {
  const stats = useMemo(() => {
    const total = rows.length;
    const ratings = rows.map(r => r.rating).filter(v => v > 0);
    const avgRating = ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : 0;
    const sentiments = rows.map(r => r.sentiment).filter(v => !isNaN(v));
    const avgSent = sentiments.length ? sentiments.reduce((a,b)=>a+b,0)/sentiments.length : 0;
    const c = { GREEN:0, AMBER:0, RED:0 };
    rows.forEach(r => { if (c[r.rag] !== undefined) c[r.rag]++; });
    return { total, avgRating, avgSent, ...c };
  }, [rows]);

  const cards = [
    { label: 'Total reviews', value: stats.total, accent: 'from-indigo-500 to-blue-500' },
    { label: 'Avg rating',    value: stats.avgRating.toFixed(2), suffix: '/ 5', accent: 'from-violet-500 to-purple-500' },
    { label: 'Avg sentiment', value: stats.avgSent.toFixed(2), accent: 'from-cyan-500 to-teal-500' },
    { label: 'Green',         value: stats.GREEN, accent: 'from-emerald-500 to-green-500', valueClass: 'text-emerald-500' },
    { label: 'Amber',         value: stats.AMBER, accent: 'from-amber-500 to-yellow-500', valueClass: 'text-amber-500' },
    { label: 'Red',           value: stats.RED, accent: 'from-rose-500 to-red-500', valueClass: 'text-rose-500' },
  ];

  return (
    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6 animate-slide-up">
      {cards.map((c, i) => (
        <div key={i}
          className="relative overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4 shadow-[0_2px_8px_-2px_rgba(15,23,42,0.06)] dark:shadow-none hover:shadow-[0_8px_24px_-8px_rgba(15,23,42,0.15)] dark:hover:shadow-none transition-all hover:-translate-y-0.5">
          <div className={`absolute inset-x-0 top-0 h-1 bg-gradient-to-r ${c.accent}`} />
          <div className="text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 font-bold mb-1">{c.label}</div>
          <div className={`text-2xl sm:text-3xl font-extrabold ${c.valueClass || 'text-slate-900 dark:text-slate-50'}`}>
            {c.value}
            {c.suffix && <span className="text-sm font-medium text-slate-500 dark:text-slate-400 ml-1">{c.suffix}</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

// ============================================================
// CHARTS
// ============================================================
function chartColors(theme) {
  const dark = theme === 'dark';
  return {
    text: dark ? '#e2e8f0' : '#0f172a',
    muted: dark ? '#94a3b8' : '#475569',
    grid: dark ? '#1e293b' : '#cbd5e1',
  };
}

function RagDonut({ rows, theme }) {
  const c = chartColors(theme);
  const counts = { GREEN:0, AMBER:0, RED:0 };
  rows.forEach(r => { if (counts[r.rag] !== undefined) counts[r.rag]++; });
  const labels = Object.keys(counts);
  return (
    <Card className="p-5">
      <CardHeader title="RAG distribution" subtitle="Red / Amber / Green breakdown" />
      <div className="h-72">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'doughnut',
            data: {
              labels,
              datasets: [{
                data: labels.map(l => counts[l]),
                backgroundColor: labels.map(l => RAG_COLORS[l]),
                borderColor: theme === 'dark' ? '#0f172a' : '#ffffff',
                borderWidth: 3,
                hoverOffset: 8,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '65%',
              plugins: {
                legend: { position: 'bottom', labels: { color: c.text, padding: 16, font: { size: 12, weight: '500' } } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

function YearRagChart({ rows, theme }) {
  const c = chartColors(theme);
  const byYear = {};
  rows.forEach(r => {
    if (!r.date) return;
    const y = r.date.getFullYear();
    if (!byYear[y]) byYear[y] = { GREEN:0, AMBER:0, RED:0 };
    if (byYear[y][r.rag] !== undefined) byYear[y][r.rag]++;
  });
  const years = Object.keys(byYear).map(Number).sort((a,b)=>a-b);
  return (
    <Card className="p-5">
      <CardHeader title="Year × RAG trend" subtitle="Sentiment health over time" />
      <div className="h-72">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'bar',
            data: {
              labels: years,
              datasets: ['GREEN','AMBER','RED'].map(rag => ({
                label: rag,
                data: years.map(y => byYear[y][rag]),
                backgroundColor: RAG_COLORS[rag],
                borderRadius: 6,
                maxBarThickness: 40,
              }))
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: c.text, font: { size: 12 } } } },
              scales: {
                x: { stacked: true, ticks: { color: c.muted }, grid: { color: c.grid, drawBorder: false } },
                y: { stacked: true, ticks: { color: c.muted }, grid: { color: c.grid, drawBorder: false } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

function HBarChart({ title, subtitle, data, color, rows, theme }) {
  const c = chartColors(theme);
  return (
    <Card className="p-5">
      <CardHeader title={title} subtitle={subtitle} />
      <div className="h-96">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'bar',
            data: {
              labels: data.map(d => d[0]),
              datasets: [{
                data: data.map(d => d[1]),
                backgroundColor: color,
                borderRadius: 6,
                maxBarThickness: 24,
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: c.muted }, grid: { color: c.grid, drawBorder: false } },
                y: { ticks: { color: c.text, font: { size: 11 } }, grid: { display: false, drawBorder: false } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

function ThemeChart({ rows, theme }) {
  const counts = {};
  rows.forEach(r => {
    if (!r.themes) return;
    r.themes.split(',').map(t => t.trim()).filter(Boolean).forEach(t => {
      counts[t] = (counts[t] || 0) + 1;
    });
  });
  const data = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 12);
  return <HBarChart title="Top themes" subtitle="Most-mentioned topics in reviews" data={data} color="#8b5cf6" rows={rows} theme={theme} />;
}

function SourceChart({ rows, theme }) {
  const counts = {};
  rows.forEach(r => { if (r.source) counts[r.source] = (counts[r.source] || 0) + 1; });
  const data = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 12);
  return <HBarChart title="Top sources" subtitle="Channels with most reviews" data={data} color="#3b82f6" rows={rows} theme={theme} />;
}

function SentimentChart({ rows, theme }) {
  const c = chartColors(theme);
  const agg = {};
  rows.forEach(r => {
    if (!r.source) return;
    if (!agg[r.source]) agg[r.source] = { sum:0, n:0 };
    agg[r.source].sum += r.sentiment;
    agg[r.source].n += 1;
  });
  const data = Object.entries(agg)
    .filter(([,v]) => v.n >= 2)
    .map(([k,v]) => [k, v.sum/v.n, v.n])
    .sort((a,b) => a[1] - b[1]);
  return (
    <Card className="p-5">
      <CardHeader title="Sentiment by source" subtitle="Sources with 2+ reviews — diverging by polarity" />
      <div className="h-96">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'bar',
            data: {
              labels: data.map(d => d[0]),
              datasets: [{
                data: data.map(d => d[1]),
                backgroundColor: data.map(d => d[1] >= 0 ? '#10b981' : '#ef4444'),
                borderRadius: 6,
                maxBarThickness: 22,
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => `Sentiment ${ctx.parsed.x.toFixed(2)} (n=${data[ctx.dataIndex][2]})` } }
              },
              scales: {
                x: { min: -1, max: 1, ticks: { color: c.muted }, grid: { color: c.grid, drawBorder: false } },
                y: { ticks: { color: c.text, font: { size: 11 } }, grid: { display: false, drawBorder: false } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

// ============================================================
// REVIEWS TABLE
// ============================================================
function ReviewsTable({ rows, filtered, filters, setFilters, sources, themes }) {
  return (
    <Card className="p-5">
      <CardHeader
        title="All reviews"
        subtitle={`${filtered.length} of ${rows.length} reviews — exports use the filtered set`}
      />
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2 mb-4">
        <div className="relative col-span-1 sm:col-span-2 lg:col-span-2">
          <SearchIcon className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input
            value={filters.search}
            onChange={e => setFilters(f => ({...f, search: e.target.value}))}

        </div>
        <select value={filters.rag} onChange={e => setFilters(f => ({...f, rag: e.target.value}))}

          <option value="">All RAG</option>
          <option value="GREEN">GREEN</option>
          <option value="AMBER">AMBER</option>
          <option value="RED">RED</option>
        </select>
        <select value={filters.source} onChange={e => setFilters(f => ({...f, source: e.target.value}))}
          className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium text-slate-900 dark:text-slate-100 shadow-sm dark:shadow-none focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">All sources</option>
          {sources.map(s => <option key={s} value={s}>{s}</option>)}

      </div>

        <select value={filters.theme} onChange={e => setFilters(f => ({...f, theme: e.target.value}))}
          className="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-medium text-slate-900 dark:text-slate-100 shadow-sm dark:shadow-none focus:outline-none focus:ring-2 focus:ring-indigo-500 col-span-1 lg:col-span-1">

        <button onClick={() => setFilters({ search: '', rag: '', source: '', theme: '' })}
          className="px-3 py-2 rounded-lg text-sm font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-transparent transition">

      <div className="overflow-auto rounded-xl border border-slate-200 dark:border-slate-800 max-h-[600px] bg-white dark:bg-transparent">

            <tr>

              <th className="text-left px-3 py-3 font-bold">Source</th>
              <th className="text-left px-3 py-3 font-bold">User</th>
              <th className="text-left px-3 py-3 font-bold">Rating</th>
              <th className="text-left px-3 py-3 font-bold">Sent.</th>

              <th className="text-left px-3 py-3 font-bold">Themes</th>

          <tbody className="divide-y divide-slate-200 dark:divide-slate-800">

// ============================================================
// APP
// ============================================================
function App() {
  const { rows, loading, error, lastUpdated, reload } = useData();
  const [theme, toggleTheme] = useTheme();
  const [filters, setFilters] = useState({ search: '', rag: '', source: '', theme: '' });

  const sources = useMemo(() => [...new Set(rows.map(r => r.source).filter(Boolean))].sort(), [rows]);
  const themesList = useMemo(() => {
    const s = new Set();
    rows.forEach(r => r.themes.split(',').map(t => t.trim()).filter(Boolean).forEach(t => s.add(t)));
    return [...s].sort();
  }, [rows]);

  const filtered = useMemo(() => {
    const q = filters.search.toLowerCase().trim();
    let out = rows.filter(r => {
      if (filters.rag && r.rag !== filters.rag) return false;
      if (filters.source && r.source !== filters.source) return false;
      if (filters.theme && !r.themes.toLowerCase().includes(filters.theme.toLowerCase())) return false;
      if (q) {
        const hay = `${r.source} ${r.username} ${r.review} ${r.themes} ${r.category_tags}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    out.sort((a,b) => (b.date?.getTime() || 0) - (a.date?.getTime() || 0));
    return out;
  }, [rows, filters]);

  const handleExport = (fmt) => {
    if (filtered.length === 0) return;
    if (fmt === 'csv') exportCSV(filtered);
    else if (fmt === 'xlsx') exportXLSX(filtered);
    else if (fmt === 'pdf') exportPDF(filtered);
  };

  return (
    <div className="min-h-screen">
      <Header theme={theme} toggleTheme={toggleTheme} onRefresh={reload} loading={loading} lastUpdated={lastUpdated} onExport={handleExport} />
      <main className="max-w-7xl mx-auto px-6 py-6">
        {error && (
          <div className="mb-6 p-4 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-sm">
            <b>Failed to load data:</b> {error}
            <div className="mt-1 text-xs opacity-80">
              Check that <code>{FILE_PATH}</code> exists in <code>{GITHUB_OWNER}/{GITHUB_REPO}@{GITHUB_BRANCH}</code> and is public.
            </div>
          </div>
        )}
        {loading && rows.length === 0 ? (
          <div className="flex items-center justify-center py-32">
            <div className="text-center">
              <div className="w-12 h-12 mx-auto border-4 border-slate-200 dark:border-slate-800 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
              <p className="text-slate-500 dark:text-slate-400 text-sm">Loading data from GitHub…</p>
            </div>
          </div>
        ) : rows.length > 0 ? (
          <>
            <RagChips rows={rows} value={filters.rag} onChange={(v) => setFilters(f => ({...f, rag: v}))} />
            <KpiGrid rows={filtered} />
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4 animate-slide-up">
              <div className="lg:col-span-1"><RagDonut rows={filtered} theme={theme} /></div>
              <div className="lg:col-span-2"><YearRagChart rows={filtered} theme={theme} /></div>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4 animate-slide-up">
              <ThemeChart rows={filtered} theme={theme} />
              <SourceChart rows={filtered} theme={theme} />
            </div>
            <div className="mb-4 animate-slide-up"><SentimentChart rows={filtered} theme={theme} /></div>
            <div className="animate-slide-up">
              <ReviewsTable
                rows={rows}
                filtered={filtered}
                filters={filters}
                setFilters={setFilters}
                sources={sources}
                themes={themesList}
              />
            </div>
          </>
        ) : null}
        <footer className="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-500 flex items-center justify-between flex-wrap gap-2">
          <span>Data auto-syncs from <a className="text-indigo-600 dark:text-indigo-500 hover:text-indigo-700 dark:hover:text-indigo-400 font-semibold" target="_blank" rel="noopener" href={`https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}`}>{GITHUB_OWNER}/{GITHUB_REPO}</a> — refreshes every 10 min.</span>
          <span>Built with React • Tailwind • Chart.js • SheetJS • jsPDF</span>
        </footer>
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
