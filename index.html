<script>
  // Apply theme class BEFORE paint to avoid flash, and BEFORE Tailwind loads
  // so it sees the correct class state from the start.
  try {
    const t = localStorage.getItem('theme') || 'dark';
    if (t === 'dark') document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  } catch (_) {}
</script>

const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ============================================================
// CONFIG
// ============================================================
const GITHUB_OWNER = 'himanshupandey3007-png';
const GITHUB_REPO  = 'Umang-Reviews-Data';
const GITHUB_BRANCH = 'main';
const FILE_PATH    = 'umang_all_reviews.xlsx';

const dataUrl = () =>
  `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${FILE_PATH}?t=${Date.now()}`;

const RAG_COLORS = { GREEN: '#10b981', AMBER: '#f59e0b', RED: '#ef4444' };

// ============================================================
// CHART COMPONENT — uses Chart.js via refs
// ============================================================
function ChartCanvas({ config, deps }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, config);
    return () => { chartRef.current?.destroy(); };
  }, deps);
  return <canvas ref={ref} />;
}

// ============================================================
// DATA HOOK
// ============================================================
function useData() {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);

  const load = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch(dataUrl(), { cache: 'reload' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const sheet = wb.Sheets['All reviews'] || wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      const cleaned = data.map(r => {
        const rawRating = Number(r.rating) || 0;
        // Rating remap rule: 0,1 -> 3 ; 2,3 -> 4 ; 4,5 -> 5
        const ratingAdj = rawRating <= 1 ? 3 : rawRating <= 3 ? 4 : 5;
        const rawSent = typeof r.sentiment === 'number' ? r.sentiment : (parseFloat(r.sentiment) || 0);
        // Sentiment rescale: [-1, +1] -> [0, 10] (5 = neutral)
        const sent10 = Math.max(0, Math.min(10, (rawSent + 1) * 5));
        return {
          source: String(r.source || ''),
          username: String(r.username || ''),
          ratingRaw: rawRating,
          rating: ratingAdj,
          date: r.date instanceof Date ? r.date : (r.date ? new Date(r.date) : null),
          review: String(r.review || ''),
          category_tags: String(r.category_tags || ''),
          url: String(r.url || ''),
          sentimentRaw: rawSent,
          sentiment: sent10,
          themes: String(r.themes || ''),
          rag: String(r.rag || '').toUpperCase(),
          url_link: String(r.url_link || r.url || '')
        };
      });
      setRows(cleaned);
      setLastUpdated(new Date());
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    const t = setInterval(load, 10 * 60 * 1000);
    return () => clearInterval(t);
  }, [load]);

  return { rows, loading, error, lastUpdated, reload: load };
}

// ============================================================
// THEME HOOK
// ============================================================
function useTheme() {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('theme') || 'dark'; }
    catch (_) { return 'dark'; }
  });
  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.body.classList.toggle('dark-bg', theme === 'dark');
    document.body.classList.toggle('light-bg', theme === 'light');
    document.body.classList.toggle('text-slate-100', theme === 'dark');
    document.body.classList.toggle('text-slate-900', theme === 'light');
    try { localStorage.setItem('theme', theme); } catch (_) {}
  }, [theme]);
  return [theme, () => setTheme(t => t === 'dark' ? 'light' : 'dark')];
}

// ============================================================
// EXPORTS
// ============================================================
function exportCSV(rows) {
  const headers = ['date','source','username','rating','sentiment','rag','themes','review','url_link'];
  const escape = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const lines = [headers.join(',')];
  rows.forEach(r => {
    lines.push(headers.map(h => {
      if (h === 'date') return escape(r.date ? r.date.toISOString().slice(0,10) : '');
      return escape(r[h]);
    }).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  triggerDownload(blob, `umang-reviews-${dateStamp()}.csv`);
}

function exportXLSX(rows) {
  const data = rows.map(r => ({
    date: r.date ? r.date.toISOString().slice(0,10) : '',
    source: r.source,
    username: r.username,
    rating: r.rating,
    sentiment: r.sentiment,
    rag: r.rag,
    themes: r.themes,
    review: r.review,
    url_link: r.url_link,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Reviews');
  XLSX.writeFile(wb, `umang-reviews-${dateStamp()}.xlsx`);
}

function exportPDF(rows) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  doc.setFontSize(16);
  doc.setTextColor(30, 41, 59);
  doc.text('UMANG App — Reviews Export', 40, 40);
  doc.setFontSize(10);
  doc.setTextColor(100, 116, 139);
  doc.text(`Generated ${new Date().toLocaleString()}  •  ${rows.length} review(s)`, 40, 58);

  doc.autoTable({
    startY: 75,
    head: [['Date','Source','User','Rating','Sent.','RAG','Themes','Review']],
    body: rows.map(r => [
      r.date ? r.date.toISOString().slice(0,10) : '',
      r.source,
      r.username,
      r.rating || '',
      typeof r.sentiment === 'number' ? r.sentiment.toFixed(2) : '',
      r.rag,
      r.themes,
      r.review.length > 220 ? r.review.slice(0, 217) + '…' : r.review,
    ]),
    styles: { fontSize: 8, cellPadding: 4, overflow: 'linebreak', valign: 'top' },
    headStyles: { fillColor: [30, 41, 59], textColor: 255, fontSize: 9 },
    columnStyles: {
      0: { cellWidth: 60 }, 1: { cellWidth: 90 }, 2: { cellWidth: 70 },
      3: { cellWidth: 38 }, 4: { cellWidth: 38 }, 5: { cellWidth: 45 },
      6: { cellWidth: 120 }, 7: { cellWidth: 'auto' },
    },
    didParseCell: (data) => {
      if (data.section === 'body' && data.column.index === 5) {
        const v = data.cell.raw;
        if (v === 'GREEN') { data.cell.styles.textColor = [16,185,129]; data.cell.styles.fontStyle = 'bold'; }
        if (v === 'AMBER') { data.cell.styles.textColor = [245,158,11]; data.cell.styles.fontStyle = 'bold'; }
        if (v === 'RED')   { data.cell.styles.textColor = [239,68,68]; data.cell.styles.fontStyle = 'bold'; }
      }
    }
  });
  doc.save(`umang-reviews-${dateStamp()}.pdf`);
}

function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a);
  a.click(); a.remove(); URL.revokeObjectURL(url);
}
function dateStamp() { return new Date().toISOString().slice(0,10); }

// ============================================================
// HEADER
// ============================================================

    const onClick = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setOpen(false); };

    return () => document.removeEventListener('mousedown', onClick);
  }, []);

    <header className="sticky top-0 z-40 glass border-b border-slate-200 dark:border-slate-800/70 bg-white/95 dark:bg-slate-950/70 shadow-sm dark:shadow-none">
      <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
            <span className="text-white font-bold text-lg">U</span>
          </div>
          <div>
            <h1 className="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-50 leading-tight">
              UMANG App — Reviews Dashboard
            </h1>
            <p className="text-xs text-slate-600 dark:text-slate-400">
              Live feedback across app stores, news & social
            </p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs text-slate-600 dark:text-slate-400 hidden sm:inline">
            {lastUpdated ? `Updated ${lastUpdated.toLocaleTimeString()}` : 'Loading…'}
          </span>
          <button onClick={onRefresh} disabled={loading}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-transparent transition disabled:opacity-50">
            <RefreshIcon className={`w-3.5 h-3.5 ${loading ? 'animate-spin-slow' : ''}`} />
            <span className="hidden sm:inline">Refresh</span>
          </button>
          <div className="relative" ref={menuRef}>
            <button onClick={() => setOpen(o => !o)}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-md shadow-indigo-600/30">
              <DownloadIcon className="w-3.5 h-3.5" />
              <span className="hidden sm:inline">Export</span>
              <ChevronDown className="w-3.5 h-3.5" />

              <div className="absolute right-0 mt-2 w-44 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-xl overflow-hidden animate-fade-in z-50">
                {[
                  { label: 'Export CSV', fmt: 'csv' },
                  { label: 'Export Excel', fmt: 'xlsx' },
                  { label: 'Export PDF', fmt: 'pdf' },
                ].map(opt => (
                  <button key={opt.fmt}
                    onClick={() => { onExport(opt.fmt); setOpen(false); }}
                    className="w-full text-left px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200">
                    {opt.label}
                  </button>
                ))}
              </div>
            )}
          </div>
          <button onClick={toggleTheme}
            className="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-transparent transition"

// ============================================================
// RAG FILTER CHIPS — global filter
// ============================================================
function RagChips({ rows, value, onChange }) {
  const counts = useMemo(() => {
    const c = { GREEN: 0, AMBER: 0, RED: 0 };
    rows.forEach(r => { if (c[r.rag] !== undefined) c[r.rag]++; });
    return { ...c, total: rows.length };
  }, [rows]);

  const chips = [
    { v: '',      label: 'All',   count: counts.total,
      idle: 'border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300',
      active: 'bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 border-slate-800 dark:border-slate-100',
      dot: 'bg-slate-400' },
    { v: 'GREEN', label: 'Green', count: counts.GREEN,
      idle: 'border-emerald-300 dark:border-emerald-700/60 text-emerald-700 dark:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/10',
      active: 'bg-emerald-500 text-white border-emerald-500 shadow-md shadow-emerald-500/30',
      dot: 'bg-emerald-500' },
    { v: 'AMBER', label: 'Amber', count: counts.AMBER,
      idle: 'border-amber-300 dark:border-amber-700/60 text-amber-700 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-500/10',
      active: 'bg-amber-500 text-white border-amber-500 shadow-md shadow-amber-500/30',
      dot: 'bg-amber-500' },
    { v: 'RED',   label: 'Red',   count: counts.RED,
      idle: 'border-rose-300 dark:border-rose-700/60 text-rose-700 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10',
      active: 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/30',
      dot: 'bg-rose-500' },
  ];

  return (
    <div className="flex items-center gap-2 flex-wrap mb-4 animate-slide-up">
      <span className="text-xs uppercase tracking-wider font-semibold text-slate-500 dark:text-slate-400 mr-1">Filter:</span>
      {chips.map(c => {
        const active = value === c.v;
        return (
          <button
            key={c.v || 'all'}
            onClick={() => onChange(c.v)}
            className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-sm font-semibold border transition-all ${active ? c.active : `bg-white dark:bg-slate-900/60 ${c.idle}`}`}
          >
            <span className={`w-2 h-2 rounded-full ${active ? 'bg-white' : c.dot}`}></span>
            <span>{c.label}</span>
            <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-bold ${active ? 'bg-white/25' : 'bg-slate-100 dark:bg-slate-800'}`}>{c.count}</span>
          </button>
        );
      })}
    </div>
  );
}

// ============================================================
// KPI GRID
// ============================================================
function KpiGrid({ rows, onDrill }) {
  const stats = useMemo(() => {
    const total = rows.length;
    const ratings = rows.map(r => r.rating).filter(v => v > 0);
    const avgRating = ratings.length ? ratings.reduce((a,b)=>a+b,0)/ratings.length : 0;
    const sentiments = rows.map(r => r.sentiment).filter(v => !isNaN(v));
    const avgSent = sentiments.length ? sentiments.reduce((a,b)=>a+b,0)/sentiments.length : 0;
    const c = { GREEN:0, AMBER:0, RED:0 };
    rows.forEach(r => { if (c[r.rag] !== undefined) c[r.rag]++; });
    return { total, avgRating, avgSent, ...c };
  }, [rows]);

  const cards = [
    { label: 'Total reviews', value: stats.total, accent: 'from-indigo-500 to-blue-500',
      info: 'Count of reviews in the current filter scope.', drill: 'all' },
    { label: 'Avg rating',    value: stats.avgRating.toFixed(2), suffix: '/ 5', accent: 'from-violet-500 to-purple-500',
      info: 'Mean of all ratings in scope, after the remap rule: original 0,1 -> 3 | 2,3 -> 4 | 4,5 -> 5.', drill: null },
    { label: 'Avg sentiment', value: stats.avgSent.toFixed(2), suffix: '/ 10', accent: 'from-cyan-500 to-teal-500',
      info: 'Mean sentiment on a 0-10 scale (5 = neutral). Computed by rescaling each review’s raw NLP sentiment score from [-1, +1] to [0, 10].', drill: null },
    { label: 'Green',         value: stats.GREEN, accent: 'from-emerald-500 to-green-500', valueClass: 'text-emerald-500',
      info: 'Reviews flagged GREEN — positive feedback. Click to view them.', drill: 'GREEN' },
    { label: 'Amber',         value: stats.AMBER, accent: 'from-amber-500 to-yellow-500', valueClass: 'text-amber-500',
      info: 'Reviews flagged AMBER — mixed / neutral. Click to view them.', drill: 'AMBER' },
    { label: 'Red',           value: stats.RED, accent: 'from-rose-500 to-red-500', valueClass: 'text-rose-500',
      info: 'Reviews flagged RED — negative / problematic. Click to view them.', drill: 'RED' },
  ];

  return (
    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6 animate-slide-up">
      {cards.map((c, i) => {
        const isClickable = !!c.drill;
        return (
          <div key={i}
            onClick={() => {
              if (!isClickable) return;
              if (c.drill === 'all') onDrill && onDrill({});
              else onDrill && onDrill({ rag: c.drill });
            }}
            className={`relative rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4 shadow-[0_2px_8px_-2px_rgba(15,23,42,0.06)] dark:shadow-none hover:shadow-[0_8px_24px_-8px_rgba(15,23,42,0.15)] dark:hover:shadow-none transition-all hover:-translate-y-0.5 ${isClickable ? 'cursor-pointer' : ''}`}>
            <div className={`absolute inset-x-0 top-0 h-1 rounded-t-2xl bg-gradient-to-r ${c.accent}`} />
            <div className="flex items-center text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 font-bold mb-1">
              <span>{c.label}</span>
              <InfoTip text={c.info} />
            </div>
            <div className={`text-2xl sm:text-3xl font-extrabold ${c.valueClass || 'text-slate-900 dark:text-slate-50'}`}>
              {c.value}
              {c.suffix && <span className="text-sm font-medium text-slate-500 dark:text-slate-400 ml-1">{c.suffix}</span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// CHARTS
// ============================================================
function chartColors(theme) {
  const dark = theme === 'dark';
  return {
    text: dark ? '#e2e8f0' : '#0f172a',
    muted: dark ? '#94a3b8' : '#475569',
    grid: dark ? '#1e293b' : '#cbd5e1',
  };
}

function RagDonut({ rows, theme, onDrill }) {
  const c = chartColors(theme);
  const counts = { GREEN:0, AMBER:0, RED:0 };
  rows.forEach(r => { if (counts[r.rag] !== undefined) counts[r.rag]++; });
  const labels = Object.keys(counts);
  return (
    <Card className="p-5">
      <CardHeader title="RAG distribution" subtitle="Red / Amber / Green breakdown"
        info="Share of reviews flagged GREEN (positive), AMBER (mixed) or RED (negative) in the current filter scope. Click a slice to view its reviews." />
      <div className="h-72">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'doughnut',
            data: {
              labels,
              datasets: [{
                data: labels.map(l => counts[l]),
                backgroundColor: labels.map(l => RAG_COLORS[l]),
                borderColor: theme === 'dark' ? '#0f172a' : '#ffffff',
                borderWidth: 3,
                hoverOffset: 8,
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '65%',
              onClick: (evt, els) => {
                if (els.length && onDrill) {
                  onDrill({ rag: labels[els[0].index] });
                }
              },
              plugins: {
                legend: { position: 'bottom', labels: { color: c.text, padding: 16, font: { size: 12, weight: '500' } } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

function YearRagChart({ rows, theme, onDrill }) {
  const c = chartColors(theme);
  const byYear = {};
  rows.forEach(r => {
    if (!r.date) return;
    const y = r.date.getFullYear();
    if (!byYear[y]) byYear[y] = { GREEN:0, AMBER:0, RED:0 };
    if (byYear[y][r.rag] !== undefined) byYear[y][r.rag]++;
  });
  const years = Object.keys(byYear).map(Number).sort((a,b)=>a-b);
  return (
    <Card className="p-5">
      <CardHeader title="Year × RAG trend" subtitle="Sentiment health over time"
        info="Stacked count of GREEN / AMBER / RED reviews per year. Click any segment to drill into reviews from that year + RAG combination." />
      <div className="h-72">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'bar',
            data: {
              labels: years,
              datasets: ['GREEN','AMBER','RED'].map(rag => ({
                label: rag,
                data: years.map(y => byYear[y][rag]),
                backgroundColor: RAG_COLORS[rag],
                borderRadius: 6,
                maxBarThickness: 40,
              }))
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              onClick: (evt, els) => {
                if (els.length && onDrill) {
                  const year = years[els[0].index];
                  const rag  = ['GREEN','AMBER','RED'][els[0].datasetIndex];
                  onDrill({ year, rag });
                }
              },
              plugins: { legend: { labels: { color: c.text, font: { size: 12 } } } },
              scales: {
                x: { stacked: true, ticks: { color: c.muted }, grid: { color: c.grid, drawBorder: false } },
                y: { stacked: true, ticks: { color: c.muted }, grid: { color: c.grid, drawBorder: false } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

function HBarChart({ title, subtitle, info, data, color, rows, theme, onBarClick }) {
  const c = chartColors(theme);
  return (
    <Card className="p-5">
      <CardHeader title={title} subtitle={subtitle} info={info} />
      <div className="h-96">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'bar',
            data: {
              labels: data.map(d => d[0]),
              datasets: [{
                data: data.map(d => d[1]),
                backgroundColor: color,
                borderRadius: 6,
                maxBarThickness: 24,
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              onClick: (evt, els) => {
                if (els.length && onBarClick) onBarClick(data[els[0].index][0]);
              },
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { color: c.muted }, grid: { color: c.grid, drawBorder: false } },
                y: { ticks: { color: c.text, font: { size: 11 } }, grid: { display: false, drawBorder: false } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

function ThemeChart({ rows, theme, onDrill }) {
  const counts = {};
  rows.forEach(r => {
    if (!r.themes) return;
    r.themes.split(',').map(t => t.trim()).filter(Boolean).forEach(t => {
      counts[t] = (counts[t] || 0) + 1;
    });
  });
  const data = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 12);
  return <HBarChart title="Top themes" subtitle="Most-mentioned topics in reviews"
    info="Number of reviews mentioning each theme. A single review can mention multiple themes (themes are comma-separated). Click a bar to see reviews tagged with that theme."
    data={data} color="#8b5cf6" rows={rows} theme={theme}
    onBarClick={(theme) => onDrill && onDrill({ theme })} />;
}

function SourceChart({ rows, theme, onDrill }) {
  const counts = {};
  rows.forEach(r => { if (r.source) counts[r.source] = (counts[r.source] || 0) + 1; });
  const data = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0, 12);
  return <HBarChart title="Top sources" subtitle="Channels with most reviews"
    info="Number of reviews per source channel (Play Store, Twitter/X, news sites, etc). Top 12 shown. Click a bar to see all reviews from that source."
    data={data} color="#3b82f6" rows={rows} theme={theme}
    onBarClick={(source) => onDrill && onDrill({ source })} />;
}

function SentimentChart({ rows, theme, onDrill }) {
  const c = chartColors(theme);
  const agg = {};
  rows.forEach(r => {
    if (!r.source) return;
    if (!agg[r.source]) agg[r.source] = { sum:0, n:0 };
    agg[r.source].sum += r.sentiment;
    agg[r.source].n += 1;
  });
  const data = Object.entries(agg)
    .filter(([,v]) => v.n >= 2)
    .map(([k,v]) => [k, v.sum/v.n, v.n])
    .sort((a,b) => a[1] - b[1]);
  return (
    <Card className="p-5">
      <CardHeader title="Sentiment by source" subtitle="Sources with 2+ reviews — 0-10 polarity scale"
        info="Average sentiment per source on the 0-10 scale (5 = neutral). Green bars = above 5, red bars = below 5. Click a bar to see all reviews from that source." />
      <div className="h-96">
        <ChartCanvas
          deps={[rows, theme]}
          config={{
            type: 'bar',
            data: {
              labels: data.map(d => d[0]),
              datasets: [{
                data: data.map(d => d[1]),
                backgroundColor: data.map(d => d[1] >= 5 ? '#10b981' : '#ef4444'),
                borderRadius: 6,
                maxBarThickness: 22,
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              onClick: (evt, els) => {
                if (els.length && onDrill) {
                  const idx = els[0].index;
                  onDrill({ source: data[idx][0] });
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: { callbacks: { label: ctx => `Sentiment ${ctx.parsed.x.toFixed(2)} / 10 (n=${data[ctx.dataIndex][2]})` } }
              },
              scales: {
                x: { min: 0, max: 10, ticks: { color: c.muted, stepSize: 2 }, grid: { color: c.grid, drawBorder: false } },
                y: { ticks: { color: c.text, font: { size: 11 } }, grid: { display: false, drawBorder: false } }
              }
            }
          }}
        />
      </div>
    </Card>
  );
}

// ============================================================
// DRILL-DOWN MODAL — opens when user clicks a chart slice / KPI / bar
// ============================================================
function filterRowsBy(rows, drill) {
  return rows.filter(r => {
    if (drill.rag    && r.rag !== drill.rag) return false;
    if (drill.source && r.source !== drill.source) return false;
    if (drill.theme) {
      const has = r.themes.split(',').map(s => s.trim()).includes(drill.theme);
      if (!has) return false;
    }
    if (drill.year && (!r.date || r.date.getFullYear() !== Number(drill.year))) return false;
    return true;
  });
}

function describeDrill(drill) {
  const parts = [];
  if (drill.rag)    parts.push(drill.rag);
  if (drill.year)   parts.push(drill.year);
  if (drill.source) parts.push(`source: ${drill.source}`);
  if (drill.theme)  parts.push(`theme: ${drill.theme}`);
  return parts.length ? parts.join(' · ') : 'All reviews';
}

function basicMarkdown(text) {
  // Lightweight renderer — bullets, bold, paragraphs
  const lines = (text || '').split('\n');
  const out = [];
  let buf = [];
  const flush = () => { if (buf.length) { out.push({ type: 'p', text: buf.join(' ') }); buf = []; } };
  for (const ln of lines) {
    const t = ln.trim();
    if (!t) { flush(); continue; }
    if (/^[-*•]\s+/.test(t)) { flush(); out.push({ type: 'li', text: t.replace(/^[-*•]\s+/, '') }); }
    else if (/^#{1,3}\s+/.test(t)) { flush(); out.push({ type: 'h', text: t.replace(/^#+\s+/, '') }); }
    else buf.push(t);
  }
  flush();
  const renderBold = (s) => {
    const parts = s.split(/(\*\*[^*]+\*\*)/g);
    return parts.map((p, i) => {
      if (/^\*\*[^*]+\*\*$/.test(p)) return <strong key={i}>{p.slice(2, -2)}</strong>;
      return <React.Fragment key={i}>{p}</React.Fragment>;
    });
  };
  const grouped = [];
  let group = null;
  for (const item of out) {
    if (item.type === 'li') {
      if (!group) { group = { type: 'ul', items: [] }; grouped.push(group); }
      group.items.push(item.text);
    } else {
      group = null;
      grouped.push(item);
    }
  }
  return grouped.map((g, i) => {
    if (g.type === 'ul') return <ul key={i} className="list-disc pl-6 space-y-1.5 my-2 text-sm text-slate-800 dark:text-slate-200">{g.items.map((it, j) => <li key={j}>{renderBold(it)}</li>)}</ul>;
    if (g.type === 'h')  return <h4 key={i} className="font-bold text-slate-900 dark:text-slate-100 mt-3 mb-1">{renderBold(g.text)}</h4>;
    return <p key={i} className="text-sm text-slate-800 dark:text-slate-200 leading-relaxed my-2">{renderBold(g.text)}</p>;
  });
}

function compactRows(rows) {

  return rows.map(r => ({

}

function buildSystemPrompt(rows, filters) {

async function callChatApi({ systemPrompt, history, userText }) {
  if (!GROQ_API_KEY || GROQ_API_KEY === 'PASTE_YOUR_GROQ_KEY_HERE') {
    throw new Error('Chat not configured. Open index.html and paste your Groq API key into the GROQ_API_KEY constant near the top of the script (around line 1097).');
  }
  const messages = [
    { role: 'system', content: systemPrompt },
    ...history.slice(-8).map(m => ({ role: m.role, content: m.content })),
    { role: 'user', content: userText }
  ];
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${GROQ_API_KEY}`,
    },
    body: JSON.stringify({
      model: GROQ_MODEL,
      messages,
      response_format: { type: 'json_object' },
      temperature: 0.2,
      max_tokens: 900,
    })
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(`Groq ${res.status}: ${t.slice(0,200)}`);
  }
  const json = await res.json();
  const raw = json.choices?.[0]?.message?.content || '';
  try {
    const obj = JSON.parse(raw);
    return {
      message: String(obj.message || obj.response || raw),
      filters: obj.filters && typeof obj.filters === 'object' ? obj.filters : null,
    };
  } catch {
    return { message: raw, filters: null };
  }
}

        ) : rows.length > 0 ? (
          <>
            <RagChips rows={rows} value={filters.rag} onChange={(v) => setFilters(f => ({...f, rag: v}))} />
            <div className="flex flex-wrap items-center gap-2 mb-4 animate-slide-up">
              <button onClick={() => setAiMode('insights')}
                className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white shadow-sm shadow-indigo-500/30 transition">
                <span>💡</span> AI Insights
              </button>
              <button onClick={() => setAiMode('summary')}
                className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-gradient-to-r from-cyan-500 to-teal-600 hover:from-cyan-600 hover:to-teal-700 text-white shadow-sm shadow-cyan-500/30 transition">
                <span>📋</span> Summary
              </button>
              <span className="text-xs text-slate-600 dark:text-slate-400 ml-1">Both reflect the current filter scope.</span>
            </div>
            <KpiGrid rows={filtered} onDrill={(d) => setDrill(d)} />
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4 animate-slide-up">
              <div className="lg:col-span-1"><RagDonut rows={filtered} theme={theme} onDrill={(d) => setDrill(d)} /></div>
              <div className="lg:col-span-2"><YearRagChart rows={filtered} theme={theme} onDrill={(d) => setDrill(d)} /></div>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4 animate-slide-up">
              <ThemeChart rows={filtered} theme={theme} onDrill={(d) => setDrill(d)} />
              <SourceChart rows={filtered} theme={theme} onDrill={(d) => setDrill(d)} />
            </div>
            <div className="mb-4 animate-slide-up"><SentimentChart rows={filtered} theme={theme} onDrill={(d) => setDrill(d)} /></div>
            <div className="animate-slide-up">
              <ReviewsTable
                rows={rows}
                filtered={filtered}
                filters={filters}
                setFilters={setFilters}
                sources={sources}
                themes={themesList}
              />
            </div>
          </>
        ) : null}
        <footer className="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-500 flex items-center justify-between flex-wrap gap-2">
          <span>Data auto-syncs from <a className="text-indigo-600 dark:text-indigo-500 hover:text-indigo-700 dark:hover:text-indigo-400 font-semibold" target="_blank" rel="noopener" href={`https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}`}>{GITHUB_OWNER}/{GITHUB_REPO}</a> — refreshes every 10 min.</span>
          <span>Built with React • Tailwind • Chart.js • SheetJS • jsPDF</span>
        </footer>
      </main>
      <ChatBot rows={rows} filters={filters} setFilters={setFilters} />
      <DrillDownModal
        drill={drill}
        rows={filtered}
        onClose={() => setDrill(null)}
        onApplyAsFilter={(d) => setFilters(f => ({
          ...f,
          rag:    d.rag    !== undefined ? d.rag    : f.rag,
          source: d.source !== undefined ? d.source : f.source,
          theme:  d.theme  !== undefined ? d.theme  : f.theme,
        }))}
      />
      {aiMode && (
        <AiModal
          mode={aiMode}
          rows={filtered}
          filters={filters}
          onClose={() => setAiMode(null)}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
